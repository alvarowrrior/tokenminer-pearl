[package]
name = "tokenminer-pearl"
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Motor de mineria de Pearl para GPUs NVIDIA, con verificacion de cada share contra el codigo oficial"
publish = false

[lib]
name = "tokenminer_pearl"
path = "src/lib.rs"

[dependencies]
base64 = "0.21"
bincode = "1.3.3"
blake3 = "1.8.4"
hex = "0.4"
libloading = "0.8"
pearl-blake3 = { path = "vendor/pearl-blake3", features = ["serde"] }
primitive-types = "0.12.1"
zk-pow = { path = "vendor/zk-pow" }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
